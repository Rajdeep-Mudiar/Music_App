version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resonance_backend
    restart: always
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB_NAME=${MONGO_DB_NAME:-resonance_db}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - AUDIUS_APP_NAME=${AUDIUS_APP_NAME:-ResonanceCampus}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - MIN_SUPPORTED_VERSION=${MIN_SUPPORTED_VERSION:-1.0.0}
      - APK_DOWNLOAD_URL=${APK_DOWNLOAD_URL:-https://github.com/Rajdeep-Mudiar/Music_App/releases/latest/download/app-release.apk}
    depends_on:
      - mongodb

  mongodb:
    image: mongo:8.0
    container_name: resonance_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
