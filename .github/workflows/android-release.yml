name: Android Production Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 1.0.1)'
        required: true
        default: '1.0.1'

jobs:
  build-and-release:
    name: Build Signed Android APK & GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Run test suite
        working-directory: ./mobile
        run: flutter test

      - name: Decode Keystore (if secret provided)
        if: env.KEYSTORE_BASE64 != ''
        working-directory: ./mobile/android
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build Android Release APK
        working-directory: ./mobile
        run: flutter build apk --release

      - name: Build Android App Bundle (for Google Play)
        working-directory: ./mobile
        run: flutter build appbundle --release

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
